name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Reproduce canonical Jonah RED on preimplementation head
        if: matrix.python-version == '3.11'
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin b46a869a3d458da5a43b4145a51d88f844d890a1
          git worktree add --detach /tmp/catss-canonical-red b46a869a3d458da5a43b4145a51d88f844d890a1
          if PYTHONPATH=/tmp/catss-canonical-red/src python -m pytest -q \
            /tmp/catss-canonical-red/tests/test_canonical_materializer.py \
            -k test_jonah_mixed_apparent_minus_targets_first_greek_element_in_canonical_tf \
            > /tmp/catss-canonical-red.log 2>&1; then
            cat /tmp/catss-canonical-red.log
            echo "Expected canonical Jonah scope RED passed unexpectedly"
            exit 1
          fi
          grep -q "E.*catss_annotation_target" /tmp/catss-canonical-red.log
          grep -q '1 failed' /tmp/catss-canonical-red.log
          echo 'jonah_scoped_annotation_RED_reproduced=True'

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python scripts/verify_release.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/catss-tf-release-smoke
      - run: /tmp/catss-tf-release-smoke/bin/pip install --no-deps dist/*.whl
      - name: Clean wheel installation exercises GitHub backend extra
        run: |
          python -m venv /tmp/catss-tf-github-extra
          /tmp/catss-tf-github-extra/bin/python -m pip install "dist/catss_tf-0.1.0-py3-none-any.whl[tf]"
          /tmp/catss-tf-github-extra/bin/python - <<'PY'
          import importlib.metadata

          import github
          from tf.capable import Capable

          assert github.Github is not None
          assert Capable('github').can('github')
          dist = importlib.metadata.distribution('catss-tf')
          assert any(
              'text-fabric[github]' in req and 'extra == "tf"' in req
              for req in (dist.requires or ())
          ), dist.requires
          print('clean_wheel_github_backend=True')
          PY
      - run: /tmp/catss-tf-release-smoke/bin/catss-tf --version
      - run: >-
          /tmp/catss-tf-release-smoke/bin/python -c
          "import catss_tf; from catss_tf import materialize_bhsa, materialize_lxx,
          compare_projection_bundles, TextFabricBhsaProvider, TextFabricLxxProvider;
          assert catss_tf.__version__ == '0.1.0'"


  complete-catss-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Acquire upstream snapshot for audit only
        run: |
          mkdir -p /tmp/catss-parallel
          python - <<'PY'
          import pathlib, ssl, urllib.request
          from catss_tf.source import CATSS_PARALLEL_FILENAMES, CCAT_PARALLEL_BASE_URL
          context = ssl._create_unverified_context()
          root = pathlib.Path('/tmp/catss-parallel')
          for name in CATSS_PARALLEL_FILENAMES:
              url = f'{CCAT_PARALLEL_BASE_URL}/{name}'
              with urllib.request.urlopen(url, context=context, timeout=60) as response:
                  (root / name).write_bytes(response.read())
          PY
      - name: Assert export-orphan layout repair
        run: |
          python - <<'PY'
          import pathlib

          from catss_tf.parser import parse_parallel_file
          from catss_tf.source import CATSS_PARALLEL_FILENAMES

          root = pathlib.Path('/tmp/catss-parallel')
          no_tab_physical = []
          unsplit_alignments = []
          unsplit_diagnostics = []
          for name in CATSS_PARALLEL_FILENAMES:
              document = parse_parallel_file(root / name)
              covered = []
              for verse in document.verses:
                  for alignment in verse.alignments:
                      covered.extend(alignment.source_lines)
                      if not alignment.column_split:
                          unsplit_alignments.append(
                              (name, verse.header_raw, alignment.source_lines, alignment.raw_lines)
                          )
                      for line_no, raw_line in zip(
                          alignment.source_lines,
                          alignment.raw_lines,
                      ):
                          if '\t' not in raw_line:
                              no_tab_physical.append(
                                  (
                                      name,
                                      verse.header_raw,
                                      line_no,
                                      raw_line,
                                      alignment.column_split,
                                      alignment.source_lines,
                                  )
                              )
              unsplit_diagnostics.extend(
                  (name, diagnostic.line_no, diagnostic.raw_line)
                  for diagnostic in document.diagnostics
                  if diagnostic.code == 'unsplit_row'
              )
              assert len(covered) == len(set(covered)), (name, 'duplicate source lines')
              assert sorted(covered) == sorted(document.data_line_numbers), (
                  name,
                  set(document.data_line_numbers) - set(covered),
                  set(covered) - set(document.data_line_numbers),
              )

          # Exodus preserves four formerly ignored blank/header lines.
          assert len(no_tab_physical) == 212, len(no_tab_physical)
          assert all(row[4] for row in no_tab_physical), no_tab_physical[:20]
          assert unsplit_alignments == [], unsplit_alignments[:20]
          assert unsplit_diagnostics == [], unsplit_diagnostics[:20]
          print(f'export_orphan_physical_lines={len(no_tab_physical)}')
          print('unsplit_alignments=0')
          print('unsplit_diagnostics=0')
          PY
      - name: Assert exact Exodus 35:19 corrupted-header repair
        run: |
          python - <<'PY'
          import pathlib
          from catss_tf.parser import alignment_id_for, parse_parallel_file
          from catss_tf.validation import validate_document

          path = pathlib.Path('/tmp/catss-parallel/02.Exodus.par')
          original = path.read_text(encoding='utf-8').splitlines()
          doc = parse_parallel_file(path)

          matches = [
              (verse, alignment)
              for verse in doc.verses
              for alignment in verse.alignments
              if alignment.raw_lines
              and '^ ^^^ =L/$RT {...?H/&RD} #' in alignment.raw_lines[0]
              and 'LEITOURGH/SOUSIN' in alignment.raw_lines[0]
          ]
          assert len(matches) == 1, matches
          verse, alignment = matches[0]
          assert (verse.book, verse.chapter, verse.verse) == ('Exod', 35, 19)
          assert len(alignment.raw_lines) == 7, alignment.raw_lines
          assert alignment.source_lines == tuple(range(
              alignment.source_lines[0], alignment.source_lines[0] + 7
          ))
          assert alignment.raw_lines == tuple(
              original[i - 1] for i in alignment.source_lines
          )
          assert [s.strip() for s in alignment.raw_lines[1:6]] == [
              '', 'Exod 1:10', '#', '', 'Exod 35:19'
          ]
          assert alignment.mt_raw.endswith(' {...?H/&RD} --+'), alignment.mt_raw
          assert alignment.lxx_raw.endswith('E)N AU)TAI=S'), alignment.lxx_raw
          assert all(i in doc.data_line_numbers for i in alignment.source_lines)
          assert not any(
              v.header_raw == 'Exod 1:10'
              and alignment.source_lines[0] <= v.header_line_no <= alignment.source_lines[-1]
              for v in doc.verses
          )
          assert not any(
              d.code == 'malformed_continuation'
              and alignment.source_lines[0] <= d.line_no <= alignment.source_lines[-1]
              for d in doc.diagnostics
          )
          assert alignment.alignment_id == alignment_id_for(
              source_name='02.Exodus.par',
              header_raw=verse.header_raw,
              source_lines=alignment.source_lines,
              raw_lines=alignment.raw_lines,
          )
          audit = validate_document(doc)
          assert audit.summary.unaccounted_lines == 0
          assert audit.summary.invalid_alignment_ids == 0
          print('exodus_35_19_physical_lines_preserved=7')
          PY
      - name: Assert zero-token Greek-preverb carriers
        run: |
          python - <<'PY'
          import pathlib

          from catss_tf.parser import parse_parallel_file
          from catss_tf.source import CATSS_PARALLEL_FILENAMES
          from catss_tf.technique import derive_alignment_technique

          expected = {
              ('23.Prov.par', 28, 18, 'B/)XT', '{p} ---'),
              ('27.Sirach.par', 5, 2, ')XRY 3', '{p} ---'),
              ('27.Sirach.par', 23, 17, 'B/W 3', '{p}'),
          }
          root = pathlib.Path('/tmp/catss-parallel')
          observed = set()
          preverb_total = 0

          for name in CATSS_PARALLEL_FILENAMES:
              document = parse_parallel_file(root / name)
              for verse in document.verses:
                  for alignment in verse.alignments:
                      preverbs = [
                          annotation
                          for annotation in alignment.annotations
                          if annotation.side == 'lxx'
                          and annotation.kind == 'greek_preverb'
                      ]
                      if not preverbs:
                          continue
                      preverb_total += 1
                      if alignment.mt_count <= 0 or alignment.lxx_count != 0:
                          continue

                      identity = (
                          name,
                          verse.chapter,
                          verse.verse,
                          alignment.mt_raw,
                          alignment.lxx_raw,
                      )
                      observed.add(identity)
                      assert alignment.is_lxx_minus is False, identity
                      technique = derive_alignment_technique(name, alignment)
                      assert technique.addition_vs_mt is False, identity
                      assert technique.omission_vs_mt is False, identity
                      assert technique.token_balance_mt_lxx == 'not_applicable', identity

          assert preverb_total == 290, preverb_total
          assert observed == expected, (expected - observed, observed - expected)
          print(f'greek_preverb_alignments={preverb_total}')
          print(f'zero_token_greek_preverb_carriers={len(observed)}')
          PY
      - name: Assert chained continuation grouping
        run: |
          python - <<'PY'
          import pathlib
          from catss_tf.parser import parse_parallel_file

          root = pathlib.Path('/tmp/catss-parallel')
          expected = {
              '06.JoshB.par': {3752: (3750, 3751, 3752)},
              '13.1Kings.par': {14622: (14621, 14622)},
              '27.Sirach.par': {
                  3694: (3693, 3694),
                  3696: (3695, 3696),
              },
              '45.DanielOG.par': {85: (84, 85)},
          }

          checked = 0
          for name, line_expectations in expected.items():
              document = parse_parallel_file(root / name)
              malformed = {
                  diagnostic.line_no
                  for diagnostic in document.diagnostics
                  if diagnostic.code == 'malformed_continuation'
              }
              for line_no, expected_group in line_expectations.items():
                  owners = [
                      alignment
                      for verse in document.verses
                      for alignment in verse.alignments
                      if line_no in alignment.source_lines
                  ]
                  assert len(owners) == 1, (name, line_no, owners)
                  assert owners[0].source_lines == expected_group, (
                      name,
                      line_no,
                      owners[0].source_lines,
                  )
                  assert line_no not in malformed, (name, line_no)
                  checked += 1

          assert checked == 5, checked
          print(f'chained_continuation_fragments={checked}')
          PY
      - name: Assert MT apparent-minus semantics
        run: |
          python - <<'PY'
          import collections
          import pathlib
          from catss_tf.parser import parse_parallel_file
          from catss_tf.source import CATSS_PARALLEL_FILENAMES
          from catss_tf.technique import TechniqueError, derive_alignment_technique

          root = pathlib.Path('/tmp/catss-parallel')
          marker_total = 0
          admissible = 0
          outlier_shapes = collections.Counter()
          scoped_mixed = []
          for name in CATSS_PARALLEL_FILENAMES:
              document = parse_parallel_file(root / name)
              for verse in document.verses:
                  for alignment in verse.alignments:
                      marker = alignment.mt_col_a.split(maxsplit=1)[0] if alignment.mt_col_a else ''
                      if marker != '---':
                          continue
                      marker_total += 1
                      apparent = [
                          annotation
                          for annotation in alignment.annotations
                          if annotation.side == 'mt_a'
                          and annotation.kind == 'apparent_minus'
                      ]
                      assert len(apparent) == 1
                      if alignment.mt_count == 0 and alignment.lxx_count > 0:
                          admissible += 1
                          technique = derive_alignment_technique(name, alignment)
                          assert technique.addition_vs_mt is False
                          assert technique.omission_vs_mt is False
                      else:
                          outlier_shapes[(alignment.mt_count, alignment.lxx_count)] += 1
                          identity = (
                              name, verse.chapter, verse.verse,
                              alignment.mt_raw, alignment.lxx_raw,
                          )
                          if identity == (
                              '32.Jonah.par', 4, 3, '--- YHWH', 'DE/SPOTA KU/RIE',
                          ):
                              assert alignment.mt_count == 1
                              assert alignment.lxx_count == 2
                              assert len(apparent) == 1
                              assert apparent[0].target_side == 'lxx'
                              assert apparent[0].target_index == 1
                              technique = derive_alignment_technique(name, alignment)
                              assert technique.cardinality_mt_lxx == 'one_many'
                              assert technique.token_balance_mt_lxx == 'lxx_more'
                              assert technique.addition_vs_mt is False
                              assert technique.omission_vs_mt is False
                              scoped_mixed.append(identity)
                          else:
                              # All other contradictory cardinalities remain errors.
                              assert not any(
                                  a.target_side == 'lxx' and a.target_index is not None
                                  for a in apparent
                              ), identity
                              try:
                                  derive_alignment_technique(name, alignment)
                              except TechniqueError:
                                  pass
                              else:
                                  raise AssertionError(
                                      f'unscoped contradictory minus admitted: {identity}'
                                  )
          assert scoped_mixed == [
              ('32.Jonah.par', 4, 3, '--- YHWH', 'DE/SPOTA KU/RIE'),
          ], scoped_mixed
          assert marker_total == 63, marker_total
          assert admissible == 61, admissible
          assert outlier_shapes == {(0, 0): 1, (1, 2): 1}, outlier_shapes
          print(f'mt_apparent_minus_markers={marker_total}')
          print(f'mt_apparent_minus_admissible={admissible}')
          print(f'mt_apparent_minus_outliers={dict(outlier_shapes)}')
          PY
      - name: Assert exact MT double-dash source repairs
        run: |
          python - <<'PY'
          import pathlib
          import re
          from catss_tf.parser import parse_parallel_file
          from catss_tf.source import CATSS_PARALLEL_FILENAMES

          expected = {
              (
                  '01.Genesis.par', 22, 16,
                  '--=;M/MN/Y <22.12> <sp>', "DI' E)ME/",
                  '--+=;M/MN/Y <22.12> <sp>',
              ),
              (
                  '01.Genesis.par', 48, 13,
                  '-- =;)T/M <48.10>', 'AU)TOU\\S',
                  '--+ =;)T/M <48.10>',
              ),
              (
                  '02.Exodus.par', 10, 24,
                  '--=;)LH/YKM <10.8>', 'TW=| QEW=| U(MW=N',
                  '--+=;)LH/YKM <10.8>',
              ),
              (
                  '15.1Chron.par', 11, 20,
                  '-- =B/P(M )XT', 'E)N KAIRW=| E(NI/',
                  '--+ =B/P(M )XT',
              ),
          }
          observed = set()
          repair_occurrences = []
          unrepaired_bare = []
          root = pathlib.Path('/tmp/catss-parallel')
          for name in CATSS_PARALLEL_FILENAMES:
              document = parse_parallel_file(root / name)
              for verse in document.verses:
                  for alignment in verse.alignments:
                      repairs = [
                          a for a in alignment.annotations
                          if a.side == 'mt_a' and a.kind == 'source_repair'
                      ]
                      for repair in repairs:
                          identity = (
                              name, verse.chapter, verse.verse,
                              alignment.mt_raw, alignment.lxx_raw, repair.payload,
                          )
                          if identity in expected:
                              observed.add(identity)
                              repair_occurrences.append(identity)
                      if re.match(r'^--(?=[ =])', alignment.mt_raw):
                          if not repairs:
                              unrepaired_bare.append(
                                  (name, verse.chapter, verse.verse, alignment.mt_raw, alignment.lxx_raw)
                              )
          assert observed == expected, (expected - observed, observed - expected)
          assert len(repair_occurrences) == 4, repair_occurrences
          assert len(set(repair_occurrences)) == 4, repair_occurrences
          assert unrepaired_bare == [], unrepaired_bare
          print(f'mt_double_dash_exact_repairs={len(repair_occurrences)}')
          PY
      - name: Assert exact Greek-side plus source repairs
        run: |
          python - <<'PY'
          import pathlib

          from catss_tf.parser import parse_parallel_file
          from catss_tf.source import CATSS_PARALLEL_FILENAMES
          from catss_tf.technique import derive_alignment_technique

          expected = {
              ('01.Genesis.par', 34, 29, 'KL', '--+', '---'),
              ('18.Esther.par', 7, 4, 'W/)LW', '--+', '---'),
              ('23.Prov.par', 11, 31, ')P KY', '--+', '---'),
              ('23.Prov.par', 24, 5, 'GBR', '--+', '---'),
              ('23.Prov.par', 30, 32, 'L/PH', '--+ {x}', '--- {x}'),
              ('41.Jer.par', 51, 57, 'PXWT/YH', '--+ [28.57]', '--- [28.57]'),
          }
          observed = []
          unresolved = []
          root = pathlib.Path('/tmp/catss-parallel')

          for name in CATSS_PARALLEL_FILENAMES:
              document = parse_parallel_file(root / name)
              for verse in document.verses:
                  for alignment in verse.alignments:
                      repairs = [
                          annotation
                          for annotation in alignment.annotations
                          if annotation.side == 'lxx'
                          and annotation.kind == 'source_repair'
                      ]
                      for repair in repairs:
                          identity = (
                              name,
                              verse.chapter,
                              verse.verse,
                              alignment.mt_raw,
                              alignment.lxx_raw,
                              repair.payload,
                          )
                          if identity in expected:
                              observed.append(identity)
                              assert alignment.is_lxx_minus is True
                              assert alignment.is_lxx_plus is False
                              technique = derive_alignment_technique(name, alignment)
                              assert technique.omission_vs_mt is True
                              assert technique.addition_vs_mt is False

                      first = alignment.lxx_raw.split(maxsplit=1)[0] if alignment.lxx_raw else ''
                      if (
                          first == '--+'
                          and alignment.mt_count > 0
                          and alignment.lxx_count == 0
                          and not repairs
                      ):
                          unresolved.append(
                              (
                                  name,
                                  verse.chapter,
                                  verse.verse,
                                  alignment.mt_raw,
                                  alignment.lxx_raw,
                              )
                          )

          assert set(observed) == expected, (expected - set(observed), set(observed) - expected)
          assert len(observed) == 6, observed
          assert unresolved == [], unresolved
          print(f'greek_side_plus_exact_repairs={len(observed)}')
          PY
      - name: Assert exact 1 Kings missing-minus repair
        run: |
          python - <<'PY'
          import pathlib

          from catss_tf.parser import parse_parallel_file
          from catss_tf.technique import derive_alignment_technique

          root = pathlib.Path('/tmp/catss-parallel')
          document = parse_parallel_file(root / '13.1Kings.par')
          matches = []
          for verse in document.verses:
              for alignment in verse.alignments:
                  if (
                      verse.chapter == 22
                      and verse.verse == 50
                      and alignment.mt_raw == ')X)B'
                      and alignment.lxx_raw == '[16.28g]'
                  ):
                      matches.append(alignment)

          assert len(matches) == 1, len(matches)
          alignment = matches[0]
          assert alignment.is_lxx_minus is True
          assert alignment.mt_count == 1
          assert alignment.lxx_count == 0
          refs = [
              a for a in alignment.annotations
              if a.side == 'lxx' and a.kind == 'contextual_reference'
          ]
          assert [(a.raw, a.payload) for a in refs] == [('[16.28g]', '16.28g')]
          repairs = [
              a for a in alignment.annotations
              if a.side == 'lxx' and a.kind == 'source_repair'
          ]
          assert [(a.raw, a.payload) for a in repairs] == [
              ('[16.28g]', '--- [16.28g]')
          ]
          technique = derive_alignment_technique('13.1Kings.par', alignment)
          assert technique.omission_vs_mt is True
          assert technique.addition_vs_mt is False
          print('one_kings_22_50_missing_minus_repairs=1')
          PY
      - name: Assert parent-grounded 1 Esdras lexical repair
        run: |
          python -m pip install "text-fabric>=13.1,<14"
          rm -rf /tmp/centerblc-lxx
          git init -q /tmp/centerblc-lxx
          git -C /tmp/centerblc-lxx remote add origin https://github.com/CenterBLC/LXX.git
          git -C /tmp/centerblc-lxx fetch -q --depth 1 origin f32a98eddf7eb239aa73ab863d70381e416d5076
          git -C /tmp/centerblc-lxx checkout -q FETCH_HEAD
          test "$(git -C /tmp/centerblc-lxx rev-parse HEAD)" = "f32a98eddf7eb239aa73ab863d70381e416d5076"
          python - <<'PY'
          import pathlib

          from tf.fabric import Fabric

          from catss_tf.lxx_resolver import (
              TextFabricLxxProvider,
              normalize_catss_greek,
              normalize_lxx_greek,
              resolve_lxx_document,
          )
          from catss_tf.lxx_schema import (
              LXX_MAX_NODE,
              LXX_MAX_SLOT,
              LXX_NODE_COUNTS,
              LXX_RELEASE_COMMIT,
              LXX_RELEASE_TAG,
              LXX_REPOSITORY,
              LXX_REQUIRED_FEATURES,
              LXX_SECTION_TYPES,
              LXX_SLOT_TYPE,
              LXX_VERSION,
              LxxParentProbe,
          )
          from catss_tf.parser import parse_parallel_file, parse_parallel_text
          from catss_tf.technique import derive_alignment_technique

          source = parse_parallel_file(pathlib.Path('/tmp/catss-parallel/17.1Esdras.par'))
          targets = [
              alignment
              for verse in source.verses
              if verse.chapter == 6 and verse.verse == 4
              for alignment in verse.alignments
              if alignment.mt_raw == 'L/KM' and alignment.lxx_raw == '[e5.3]'
          ]
          assert len(targets) == 1, targets
          alignment = targets[0]
          assert alignment.raw_lines == ('L/KM\t[e5.3]',)
          assert alignment.mt_tokens == ('L/KM',)
          assert alignment.lxx_tokens == ('U(MI=N',)
          assert alignment.is_transposition_stylistic is True
          assert any(
              annotation.side == 'lxx'
              and annotation.kind == 'transposition_stylistic'
              and annotation.payload == 'U(MI=N'
              for annotation in alignment.annotations
          )
          assert (alignment.mt_count, alignment.lxx_count) == (1, 1)
          assert alignment.is_lxx_plus is False
          assert alignment.is_lxx_minus is False
          assert any(
              annotation.side == 'lxx'
              and annotation.kind == 'contextual_reference'
              and annotation.raw == '[e5.3]'
              and annotation.payload == 'e5.3'
              for annotation in alignment.annotations
          )
          repairs = [
              annotation
              for annotation in alignment.annotations
              if annotation.side == 'lxx' and annotation.kind == 'source_repair'
          ]
          assert [(repair.raw, repair.payload) for repair in repairs] == [
              ('[e5.3]', '{..^U(MI=N} [e5.3]')
          ]
          carriers = [
              candidate
              for verse in source.verses
              if verse.chapter == 6 and verse.verse == 4
              for candidate in verse.alignments
              if candidate.mt_raw == '{...}' and candidate.lxx_raw == 'U(MI=N [e5.3]'
          ]
          assert len(carriers) == 1, carriers
          carrier = carriers[0]
          assert carrier.lxx_tokens == ('U(MI=N',)
          assert any(
              annotation.side == 'mt_a'
