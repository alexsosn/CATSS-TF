name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q


  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python scripts/verify_release.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/catss-tf-release-smoke
      - run: /tmp/catss-tf-release-smoke/bin/pip install --no-deps dist/*.whl
      - run: /tmp/catss-tf-release-smoke/bin/catss-tf --version
      - run: >-
          /tmp/catss-tf-release-smoke/bin/python -c
          "import catss_tf; from catss_tf import materialize_bhsa, materialize_lxx,
          compare_projection_bundles, TextFabricBhsaProvider, TextFabricLxxProvider;
          assert catss_tf.__version__ == '0.1.0'"


  complete-catss-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Acquire upstream snapshot for audit only
        run: |
          mkdir -p /tmp/catss-parallel
          python - <<'PY'
          import pathlib, ssl, urllib.request
          from catss_tf.source import CATSS_PARALLEL_FILENAMES, CCAT_PARALLEL_BASE_URL
          context = ssl._create_unverified_context()
          root = pathlib.Path('/tmp/catss-parallel')
          for name in CATSS_PARALLEL_FILENAMES:
              url = f'{CCAT_PARALLEL_BASE_URL}/{name}'
              with urllib.request.urlopen(url, context=context, timeout=60) as response:
                  (root / name).write_bytes(response.read())
          PY
      - name: Research MT double-dash against apparent-minus population
        run: |
          python - <<'PY'
          import collections
          import pathlib
          from catss_tf.parser import parse_parallel_file
          from catss_tf.source import CATSS_PARALLEL_FILENAMES

          root = pathlib.Path('/tmp/catss-parallel')
          double_dash = []
          apparent = []
          for name in CATSS_PARALLEL_FILENAMES:
              document = parse_parallel_file(root / name)
              for verse in document.verses:
                  for alignment in verse.alignments:
                      first = alignment.mt_col_a.split(maxsplit=1)[0] if alignment.mt_col_a else ''
                      record = (
                          name,
                          verse.header_raw,
                          alignment.source_lines,
                          alignment.mt_raw,
                          alignment.mt_col_b,
                          alignment.retroversion_kind,
                          alignment.mt_count,
                          alignment.lxx_count,
                          alignment.lxx_raw,
                      )
                      if first == '--':
                          double_dash.append(record)
                      elif first == '---' and alignment.mt_count == 0 and alignment.lxx_count > 0:
                          apparent.append(record)

          print('DOUBLE_DASH_COUNT', len(double_dash))
          for row in double_dash:
              print('DOUBLE_DASH', row)

          print('APPARENT_VALID_COUNT', len(apparent))
          print('APPARENT_WITH_COL_B', sum(row[4] is not None for row in apparent))
          print('APPARENT_RETRO_KINDS', collections.Counter(row[5] for row in apparent))
          print('APPARENT_SHAPES', collections.Counter((row[6], row[7]) for row in apparent))
          print('APPARENT_COL_B_PREFIXES', collections.Counter(
              (
                  row[4].split(maxsplit=1)[0][0] if row[4] else None,
                  row[5],
              )
              for row in apparent
          ))
          targets = [
              row
              for row in double_dash
              if row[4] is not None and row[6] == 0 and row[7] > 0
          ]
          exceptions = [row for row in double_dash if row not in targets]
          print('DOUBLE_DASH_TARGETS', len(targets))
          print('DOUBLE_DASH_EXCEPTIONS', exceptions)
          assert len(double_dash) == 5, len(double_dash)
          assert len(targets) == 4, len(targets)
          assert len(exceptions) == 1, exceptions
          assert exceptions[0][0:2] == ('27.Sirach.par', 'Sir 1:19')
          assert exceptions[0][4] is None
          assert exceptions[0][6:8] == (0, 0)
          PY
      - name: Assert MT apparent-minus semantics
        run: |
          python - <<'PY'
          import collections
          import pathlib
          from catss_tf.parser import parse_parallel_file
          from catss_tf.source import CATSS_PARALLEL_FILENAMES
          from catss_tf.technique import TechniqueError, derive_alignment_technique

          root = pathlib.Path('/tmp/catss-parallel')
          marker_total = 0
          admissible = 0
          outlier_shapes = collections.Counter()
          for name in CATSS_PARALLEL_FILENAMES:
              document = parse_parallel_file(root / name)
              for verse in document.verses:
                  for alignment in verse.alignments:
                      marker = alignment.mt_col_a.split(maxsplit=1)[0] if alignment.mt_col_a else ''
                      if marker != '---':
                          continue
                      marker_total += 1
                      apparent = [
                          annotation
                          for annotation in alignment.annotations
                          if annotation.side == 'mt_a'
                          and annotation.kind == 'apparent_minus'
                      ]
                      assert len(apparent) == 1
                      if alignment.mt_count == 0 and alignment.lxx_count > 0:
                          admissible += 1
                          technique = derive_alignment_technique(name, alignment)
                          assert technique.addition_vs_mt is False
                          assert technique.omission_vs_mt is False
                      else:
                          outlier_shapes[(alignment.mt_count, alignment.lxx_count)] += 1
                          try:
                              derive_alignment_technique(name, alignment)
                          except TechniqueError:
                              pass
                          else:
                              raise AssertionError(
                                  'contradictory apparent-minus cardinality must fail closed'
                              )
          assert marker_total == 63, marker_total
          assert admissible == 61, admissible
          assert outlier_shapes == {(0, 0): 1, (1, 2): 1}, outlier_shapes
          print(f'mt_apparent_minus_markers={marker_total}')
          print(f'mt_apparent_minus_admissible={admissible}')
          print(f'mt_apparent_minus_outliers={dict(outlier_shapes)}')
          PY
      - name: Assert complete notation coverage
        run: |
          set +e
          catss-tf validate --complete /tmp/catss-parallel 2>&1 | tee /tmp/catss-audit.txt
          set -e
          grep -qx 'complete_snapshot=true' /tmp/catss-audit.txt
          grep -qx 'source_files=46' /tmp/catss-audit.txt
          grep -qx 'unaccounted_lines=0' /tmp/catss-audit.txt
          grep -qx 'unknown_annotations=0' /tmp/catss-audit.txt
          # Parser diagnostics are reported above but are a separate quality layer;
          # this gate proves complete special-notation coverage without hiding them.
