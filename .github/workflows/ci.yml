name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q


  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python scripts/verify_release.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/catss-tf-release-smoke
      - run: /tmp/catss-tf-release-smoke/bin/pip install --no-deps dist/*.whl
      - run: /tmp/catss-tf-release-smoke/bin/catss-tf --version
      - run: >-
          /tmp/catss-tf-release-smoke/bin/python -c
          "import catss_tf; from catss_tf import materialize_bhsa, materialize_corpus,
          materialize_lxx, compare_projection_bundles, TextFabricBhsaProvider,
          TextFabricLxxProvider; assert catss_tf.__version__ == '0.1.0'"


  complete-catss-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Acquire upstream snapshot for audit only
        run: |
          mkdir -p /tmp/catss-parallel
          python - <<'PY'
          import pathlib, ssl, urllib.request
          from catss_tf.source import CATSS_PARALLEL_FILENAMES, CCAT_PARALLEL_BASE_URL
          context = ssl._create_unverified_context()
          root = pathlib.Path('/tmp/catss-parallel')
          for name in CATSS_PARALLEL_FILENAMES:
              url = f'{CCAT_PARALLEL_BASE_URL}/{name}'
              with urllib.request.urlopen(url, context=context, timeout=60) as response:
                  (root / name).write_bytes(response.read())
          PY
      - name: Assert complete notation coverage
        run: |
          set +e
          catss-tf validate --complete /tmp/catss-parallel 2>&1 | tee /tmp/catss-audit.txt
          set -e
          grep -qx 'complete_snapshot=true' /tmp/catss-audit.txt
          grep -qx 'source_files=46' /tmp/catss-audit.txt
          grep -qx 'unaccounted_lines=0' /tmp/catss-audit.txt
          grep -qx 'unknown_annotations=0' /tmp/catss-audit.txt
          # Parser diagnostics are reported above but are a separate quality layer;
          # this gate proves complete special-notation coverage without hiding them.

      - name: Materialize complete canonical corpus
        run: |
          python - <<'PY'
          import csv
          import pathlib
          from catss_tf import materialize_corpus

          output = pathlib.Path('/tmp/catss-canonical')
          result = materialize_corpus(
              '/tmp/catss-parallel',
              output,
              allowed_validation_codes={
                  'invalid_lxx_reference',
                  'malformed_continuation',
                  'unsplit_row',
              },
          )
          assert result.summary.source_files == 46
          assert result.summary.alignments > 300_000
          assert result.summary.alignment_slots == result.summary.alignments
          assert result.summary.audit_ok
          assert (output / 'otype.tf').is_file()
          assert (output / 'oslots.tf').is_file()
          with (output / 'catss-diagnostics.tsv').open(
              encoding='utf-8', newline=''
          ) as handle:
              diagnostic_rows = tuple(csv.DictReader(handle, delimiter='\t'))
          assert len(diagnostic_rows) == result.summary.ignored_validation_findings
          print(result.summary)
          PY
