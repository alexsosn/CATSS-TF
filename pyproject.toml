[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "catss-tf"
version = "0.1.0"
description = "Materializers for projecting CATSS Hebrew-Greek alignments onto existing Text-Fabric corpora"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Oleksandr (Alex) Sosnovshchenko" },
]
dependencies = []

[project.scripts]
catss-tf = "catss_tf.cli:main"

[project.optional-dependencies]
tf = [
  "text-fabric>=13.1,<14",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.8",
  "text-fabric>=13.1,<14",
  "twine>=5",
]

[project.urls]
Repository = "https://github.com/alexsosn/CATSS-TF"
Issues = "https://github.com/alexsosn/CATSS-TF/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
